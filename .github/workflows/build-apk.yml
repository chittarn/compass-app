name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Official Platform Files
        run: |
          flutter create --project-name compass_app --platforms=android --org com.chittaranjan .
          rm -f test/widget_test.dart
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r assets/res/* android/app/src/main/res/

      - name: Configure Unique Application ID & Gradle 8.4
        run: |
          # Replace default package ID with unique personal package ID
          sed -i 's/applicationId = "com.chittaranjan.compass_app"/applicationId = "com.chittaranjan.compass"/g' android/app/build.gradle || true
          sed -i 's/namespace = "com.chittaranjan.compass_app"/namespace = "com.chittaranjan.compass"/g' android/app/build.gradle || true
          sed -i 's/applicationId = "com.example.compass_app"/applicationId = "com.chittaranjan.compass"/g' android/app/build.gradle || true
          sed -i 's/namespace = "com.example.compass_app"/namespace = "com.chittaranjan.compass"/g' android/app/build.gradle || true

          # Write exact Gradle 8.4 wrapper configuration
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOF

          # Ensure minSdk is at least 21
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true

      - name: Restore Custom AndroidManifest Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:label="Compass"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Install Dependencies
        run: |
          flutter pub get
          touch build.log

      - name: Check Analyzer (Non-blocking)
        run: flutter analyze >> build.log 2>&1 || true

      - name: Run Tests
        run: flutter test

      - name: Build Optimized Release APKs & App Bundle (.aab)
        run: |
          flutter build apk --release >> build.log 2>&1
          flutter build apk --release --split-per-abi >> build.log 2>&1
          flutter build appbundle --release >> build.log 2>&1

      - name: Publish Build Logs to GitHub Branch if Failed
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          touch build.log
          git add -f build.log
          git commit -m "Add build.log" || true
          git push -f origin build-logs || true

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.9
          name: "Compass App v1.0.9 (Free & Lifetime Pro Architecture, 100% Ad-Free)"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
